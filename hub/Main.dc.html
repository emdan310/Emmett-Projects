<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emmett's Hub</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F0;font-family:Inter,system-ui,sans-serif;color:#16181D}
a{color:#2B3A8C}a:hover{color:#1C2766}
button,a,input{font-family:inherit}
input[type=search]::-webkit-search-cancel-button{display:none}
@media(max-width:640px){.row{grid-template-columns:minmax(0,1fr) !important}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F4F0">

<header style="background: #FFFFFF; border-bottom: 1px solid #E3E3DE; position: relative; z-index: 10">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #16181D; display: grid; place-items: center; color: #F5B700; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px">E</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">Emmett's Hub</span>
</div>

<div style="display: flex; align-items: center; gap: 8px; background: #F4F4F0; border: 1px solid #D6D6D0; border-radius: 999px; padding: 0 12px; height: 40px; width: 240px; max-width: 100%; box-sizing: border-box">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5B5E66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<label for="hub-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search projects</label>
<input id="hub-search" type="search" autocomplete="off" value="{{q}}" onChange="{{onQuery}}" placeholder="Search" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 14px; color: #16181D; outline: none; height: 38px">
</div>

<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-left: auto">
<div style="position: relative">
<button type="button" onClick="{{toggleAdd}}" aria-expanded="{{addAria}}" style="{{addBtnStyle}}">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
<span>Add project</span>
</button>
<sc-if value="{{addOpen}}" hint-placeholder-val="{{ false }}">
<form onSubmit="{{addProject}}" aria-label="Add a project" style="position: absolute; right: 0; top: 52px; width: 300px; background: #FFFFFF; border: 1px solid #E3E3DE; border-radius: 14px; box-shadow: 0 16px 40px rgba(22,24,29,0.12); padding: 16px; display: flex; flex-direction: column; gap: 10px">
<label for="np-name" style="font-size: 13px; font-weight: 600; color: #3D4047">Project name</label>
<input id="np-name" type="text" value="{{newName}}" onChange="{{onName}}" placeholder="e.g. Canyon brain" style="min-height: 44px; padding: 0 12px; border: 1px solid #D6D6D0; border-radius: 10px; font-size: 15px; box-sizing: border-box">
<label for="np-link" style="font-size: 13px; font-weight: 600; color: #3D4047">Link (optional)</label>
<input id="np-link" type="url" value="{{newLink}}" onChange="{{onLink}}" placeholder="https://" style="min-height: 44px; padding: 0 12px; border: 1px solid #D6D6D0; border-radius: 10px; font-size: 15px; box-sizing: border-box">
<sc-if value="{{addError}}" hint-placeholder-val="{{ false }}">
<span role="alert" style="font-size: 13px; color: #B3261E">{{addError}}</span>
</sc-if>
<button type="submit" style="min-height: 44px; border: 0; border-radius: 10px; background: #16181D; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">Add to hub</button>
</form>
</sc-if>
</div>

<div style="position: relative">
<button type="button" onClick="{{toggleCeo}}" aria-expanded="{{ceoAria}}" style="{{ceoBtnStyle}}">
<span>CEO · Status</span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{ceoOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Project status" style="position: absolute; right: 0; top: 52px; width: 460px; max-width: calc(100vw - 32px); max-height: 72vh; overflow-y: auto; background: #FFFFFF; border: 1px solid #E3E3DE; border-radius: 16px; box-shadow: 0 20px 48px rgba(22,24,29,0.16); padding: 18px 18px 8px; box-sizing: border-box">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Project status</span>
<span style="font-size: 12px; color: #5B5E66">Updated {{updated}}</span>
</div>
<sc-for list="{{status}}" as="g" hint-placeholder-count="3">
<div style="padding-top: 10px">
<span style="display: block; font-size: 12px; font-weight: 600; color: #5B5E66; padding-bottom: 4px">{{g.title}}</span>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<div style="border-top: 1px solid #EDEDE8; padding: 10px 0; display: flex; flex-direction: column; gap: 3px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
<span style="{{r.whenStyle}}">{{r.when}}</span>
</div>
<span style="font-size: 14px; color: #3D4047; line-height: 1.45">{{r.status}}</span>
<span style="font-size: 13px; color: #5B5E66; line-height: 1.45">{{r.latest}}</span>
<span style="font-size: 13px; color: #16181D; line-height: 1.45"><strong style="font-weight: 600">Next:</strong> {{r.next}}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>
</sc-if>
</div>
</div>
</div>
</header>

<main style="max-width: 1240px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 36px">
<sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 15px; color: #5B5E66">Nothing matches “{{q}}”.</p>
</sc-if>
<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; letter-spacing: -0.01em">{{s.title}}</h2>
<div class="row" style="{{s.gridStyle}}">
<sc-for list="{{s.cards}}" as="p" hint-placeholder-count="2">
<a href="{{p.url}}" target="_blank" rel="noopener" aria-label="{{p.name}}" style="{{p.cardStyle}}">
<sc-if value="{{p.isArt}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="{{p.shapeA}}"></div>
<div aria-hidden="true" style="{{p.shapeB}}"></div>
</sc-if>
<sc-if value="{{p.isContacts}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" viewBox="0 0 320 200" preserveAspectRatio="xMaxYMid meet" style="position: absolute; inset: 0; width: 100%; height: 100%">
<g stroke="#5FC4AE" stroke-width="2" stroke-opacity="0.55" fill="none">
<path d="M222 70 L160 40 M222 70 L282 38 M222 70 L290 118 M222 70 L196 128 M160 40 L104 26 M290 118 L268 172 M196 128 L268 172 M282 38 L290 118"></path>
</g>
<g fill="#1B8A76"><circle cx="104" cy="26" r="9"></circle><circle cx="268" cy="172" r="11"></circle><circle cx="282" cy="38" r="10"></circle></g>
<g fill="#E8F5F1"><circle cx="160" cy="40" r="12"></circle><circle cx="290" cy="118" r="13"></circle><circle cx="196" cy="128" r="11"></circle></g>
<circle cx="222" cy="70" r="30" fill="#F5B700"></circle>
<circle cx="222" cy="62" r="9" fill="#0E6B5C"></circle>
<path d="M205 88 a17 13 0 0 1 34 0 z" fill="#0E6B5C"></path>
</svg>
</sc-if>
<sc-if value="{{p.isBrain}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" viewBox="0 0 320 200" preserveAspectRatio="xMaxYMid meet" style="position: absolute; inset: 0; width: 100%; height: 100%">
<g fill="#2A2D34"><circle cx="20" cy="20" r="2"></circle><circle cx="50" cy="20" r="2"></circle><circle cx="80" cy="20" r="2"></circle><circle cx="20" cy="50" r="2"></circle><circle cx="50" cy="50" r="2"></circle><circle cx="80" cy="50" r="2"></circle><circle cx="20" cy="80" r="2"></circle><circle cx="50" cy="80" r="2"></circle><circle cx="80" cy="80" r="2"></circle></g>
<g stroke="#4A4E58" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M232 196 V150 M232 150 L186 112 M232 150 L278 112 M186 112 L160 70 M186 112 L206 66 M278 112 L258 66 M278 112 L300 70 M206 66 L196 28 M258 66 L270 26"></path>
</g>
<g fill="#16181D" stroke="#8A8F9A" stroke-width="3"><circle cx="232" cy="150" r="10"></circle><circle cx="186" cy="112" r="9"></circle><circle cx="278" cy="112" r="9"></circle><circle cx="160" cy="70" r="7"></circle><circle cx="300" cy="70" r="7"></circle></g>
<g fill="#F5B700"><circle cx="206" cy="66" r="9"></circle><circle cx="258" cy="66" r="9"></circle><circle cx="196" cy="28" r="7"></circle><circle cx="270" cy="26" r="11"></circle></g>
</svg>
</sc-if>
<sc-if value="{{p.isLearning}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" viewBox="0 0 320 200" preserveAspectRatio="xMaxYMid meet" style="position: absolute; inset: 0; width: 100%; height: 100%">
<circle cx="270" cy="44" r="26" fill="#F5B700"></circle>
<g transform="rotate(-28 210 110)">
<path d="M150 110 Q210 50 270 110 Q210 170 150 110 Z" fill="#4E9A5E"></path>
<path d="M156 110 H264 M190 110 L176 92 M190 110 L176 128 M220 110 L206 88 M220 110 L206 132 M248 110 L238 94 M248 110 L238 126" stroke="#2C6B3B" stroke-width="3" fill="none" stroke-linecap="round"></path>
</g>
<g transform="rotate(24 270 150)">
<path d="M236 150 Q270 118 304 150 Q270 182 236 150 Z" fill="#E08A2E"></path>
<path d="M240 150 H300" stroke="#A85E17" stroke-width="2.5" stroke-linecap="round"></path>
</g>
<g stroke="#8CCB98" stroke-width="3" stroke-linecap="round"><path d="M110 40 L132 18 M110 40 L138 34 M110 40 L134 50 M110 40 L120 14"></path></g>
</svg>
</sc-if>
<sc-if value="{{p.isCanyon}}" hint-placeholder-val="{{ false }}">
<img src="/_blob/f3e583077fb06361a14f5bcbc2e07942" alt="" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 52%; max-width: 210px; height: auto">
</sc-if>
<sc-if value="{{p.isCet}}" hint-placeholder-val="{{ false }}">
<img src="/_blob/7cfd000ea6f4f822ccb218f8b2ace8fb" alt="" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 70%; max-width: 270px; height: auto">
</sc-if>
<span style="{{p.titleStyle}}">{{p.name}}</span>
</a>
</sc-for>
</div>
</section>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
var ART = 'https://claude.ai/artifact/';

// Hub cards, by section. kind: 'art' (shapes) or 'logo'.
var SECTIONS = [
  { title: 'Personal', cards: [
    { name: 'Contacts', url: ART + 'CLtN7kGTqoDzgyb1pr2PHC', kind: 'contacts', bg: '#0E6B5C' },
    { name: 'Brain', url: 'https://claude.ai/projects', kind: 'brain', bg: '#16181D' }
  ] },
  { title: 'Work', cards: [
    { name: 'CET Sandbox', url: ART + 'Usk9FTN4SS5EXuX9UgGHep', kind: 'cet', bg: '#FFFFFF' },
    { name: 'Canyon Bites', url: ART + 'LyvGv14eDK2QobW5y4SiP7', kind: 'canyon', bg: '#F7EFE4' }
  ] },
  { title: 'Hobbies', cards: [
    { name: 'Learning', url: ART + 'NNbSBYePWLATDxsb8BTAZ8', kind: 'learning', bg: '#1F4D2E' }
  ] }
];

// CEO status. The nightly CEO run rewrites this block from the brain.
var UPDATED = '2026-11-24';
var STATUS = [
  { title: 'Personal', rows: [
    { name: 'Brain + skill tree', last: '2026-11-24', status: 'Running; repo access still blocked.', latest: '11/24 · CEO status view built', next: 'Give Claude GitHub access to emmett-brain, then folders (H1).' },
    { name: 'Personal interface', last: '2026-11-24', status: 'Hub reorganized: Personal, Work, Hobbies.', latest: '11/24 · Logo covers + this status panel', next: 'Tell Claude what to add next.' }
  ] },
  { title: 'Work', rows: [
    { name: 'Canyon OS features', last: '2026-11-23', status: 'Shipping. CI “Connector to dev” failed on main 11/22.', latest: '11/23 · #82 booth fee = cash expense; #81 Cost bot fix', next: 'Fix or confirm the CI failure.' },
    { name: 'Canyon brain', last: '2026-11-23', status: 'PR #83 open, preview ready.', latest: '11/23 · Opened “Add the Canyon Bites brain”', next: 'Review and merge #83.' },
    { name: 'Canyon summary material', last: '2026-11-23', status: 'Team report Nov 9–22 published.', latest: '11/23 · Team report', next: 'Next report, Nov 23–Dec 6?' },
    { name: 'Contract Matcher', last: '2026-11-24', status: 'Live; updates itself each morning.', latest: '11/24 · Daily auto-update ran', next: 'Answer the 3 critic points before the David call.' },
    { name: 'Skills Hub', last: '2026-11-23', status: 'Prototype.', latest: '11/23 · Prototype updated', next: 'David’s feedback Wed 11/25.' },
    { name: 'CET Hub', last: '2026-11-23', status: 'UI concept.', latest: '11/23 · UI concept', next: 'David’s feedback Wed 11/25.' },
    { name: 'Ticketing sync', last: '2026-11-20', status: 'Waiting on David: migration 005 + merge.', latest: '11/20 · Status sent to David', next: 'Ask on Wed call: buyer data, refunds.' }
  ] },
  { title: 'Hobbies', rows: [
    { name: 'Learning', last: '2026-11-20', status: 'Trees lesson sample (Claude’s guess at this project).', latest: '11/20 · Leaves and Needles', next: 'Tell Claude what the learning project is.' }
  ] }
];

var ADDED_LOOK = { kind: 'art', bg: '#454952',
  shapeA: 'position:absolute;width:220px;height:22px;background:#6A6F7A;right:-20px;top:40px;transform:rotate(-20deg)',
  shapeB: 'position:absolute;width:220px;height:22px;background:#F5B700;right:30px;top:96px;transform:rotate(-20deg)' };

function ago(iso) {
  var p = (iso || '').split('-'); if (p.length < 3) return { t: '', late: false };
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  var now = new Date(); var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var n = Math.round((t0 - d) / 864e5);
  return { t: n <= 0 ? 'Today' : n === 1 ? 'Yesterday' : n + ' days ago', late: n > 7 };
}

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { menu: null, q: '', added: [], newName: '', newLink: '', addError: '' }; }

  renderVals() {
    var self = this;
    var menu = this.state.menu;
    var q = (this.state.q || '').trim().toLowerCase();
    var btn = function (on, accent) {
      return 'display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;border:0;' +
        (on ? 'background:#16181D;color:#FFFFFF' : (accent ? 'background:#F5B700;color:#16181D' : 'background:#F4F4F0;color:#16181D;box-shadow:inset 0 0 0 1px #D6D6D0'));
    };
    var toggle = function (m) { return function () { self.setState({ menu: self.state.menu === m ? null : m, addError: '' }); }; };

    var card = function (c) {
      var logo = c.kind === 'canyon' || c.kind === 'cet';
      return {
        name: c.name, url: c.url, shapeA: c.shapeA || '', shapeB: c.shapeB || '',
        isArt: c.kind === 'art', isContacts: c.kind === 'contacts', isBrain: c.kind === 'brain', isLearning: c.kind === 'learning', isCanyon: c.kind === 'canyon', isCet: c.kind === 'cet',
        cardStyle: 'position:relative;display:block;overflow:hidden;height:210px;border-radius:18px;text-decoration:none;background:' + c.bg + (logo ? ';box-shadow:0 0 0 1px #E3E3DE' : ''),
        titleStyle: logo ? 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)' :
          'position:absolute;left:20px;bottom:16px;right:20px;font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:24px;letter-spacing:-0.01em;color:#FFFFFF'
      };
    };
    var all = SECTIONS.concat(this.state.added.length ? [{ title: 'Added', cards: this.state.added }] : []);
    var sections = all.map(function (s) {
      var cards = s.cards.filter(function (c) { return !q || c.name.toLowerCase().indexOf(q) !== -1 || s.title.toLowerCase().indexOf(q) !== -1; });
      return { title: s.title, cards: cards.map(card), gridStyle: 'display:grid;gap:20px;grid-template-columns:repeat(' + Math.max(cards.length, 2) + ',minmax(0,1fr))' };
    }).filter(function (s) { return s.cards.length > 0; });

    var status = STATUS.map(function (g) {
      return { title: g.title, rows: g.rows.map(function (r) {
        var a = ago(r.last);
        return { name: r.name, status: r.status, latest: r.latest, next: r.next, when: a.t,
          whenStyle: 'font-size:12px;white-space:nowrap;' + (a.late ? 'color:#B3261E;font-weight:600' : 'color:#5B5E66') };
      }) };
    });
    var u = UPDATED.split('-');

    return {
      q: this.state.q,
      onQuery: function (e) { self.setState({ q: e.target.value }); },
      sections: sections,
      noResults: q.length > 0 && sections.length === 0,
      status: status,
      updated: (+u[1]) + '/' + (+u[2]),
      addOpen: menu === 'add',
      ceoOpen: menu === 'ceo',
      addAria: menu === 'add' ? 'true' : 'false',
      ceoAria: menu === 'ceo' ? 'true' : 'false',
      addBtnStyle: btn(menu === 'add', false),
      ceoBtnStyle: btn(menu === 'ceo', true),
      toggleAdd: toggle('add'),
      toggleCeo: toggle('ceo'),
      newName: this.state.newName,
      newLink: this.state.newLink,
      addError: this.state.addError,
      onName: function (e) { self.setState({ newName: e.target.value, addError: '' }); },
      onLink: function (e) { self.setState({ newLink: e.target.value, addError: '' }); },
      addProject: function (e) {
        e.preventDefault();
        var name = self.state.newName.trim();
        var link = self.state.newLink.trim();
        if (!name) { self.setState({ addError: 'Give the project a name.' }); return; }
        var c = Object.assign({ name: name, url: link || '#' }, ADDED_LOOK);
        self.setState({ added: self.state.added.concat([c]), newName: '', newLink: '', menu: null });
      }
    };
  }
}
</script>
</body>
</html>
